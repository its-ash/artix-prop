<!doctype html>
<!--
  Social share card (1200×630). Rendered by scripts/render-og.mjs, which injects
  the black-hole frame captured from the live hero into img.plate.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #05050a; }
  body { position: relative; color: #fff; font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; }

  .plate { position: absolute; top: 0; left: __PLATE_LEFT__px; height: 630px; width: auto; }
  /* keeps the copy readable over the accretion disk without killing the glow */
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(5,5,10,.92) 0%, rgba(5,5,10,.72) 34%, rgba(5,5,10,.12) 62%, rgba(5,5,10,0) 80%),
      linear-gradient(0deg, rgba(5,5,10,.85) 0%, rgba(5,5,10,0) 30%);
  }
  .grain {
    position: absolute; inset: 0; opacity: .1; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .copy { position: absolute; left: 72px; top: 64px; width: 640px; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo svg { height: 36px; width: auto; }
  .logo .tag { font-family: 'Geist Mono'; font-weight: 500; font-size: 13px; letter-spacing: .16em; line-height: 1; padding: 6px 9px; border-radius: 7px; color: #0b1200; background: #b6f500; }
  .eyebrow { margin-top: 52px; display: flex; align-items: center; gap: 12px; font-family: 'Geist Mono'; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.72); }
  .eyebrow::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #b6f500; box-shadow: 0 0 12px #b6f500; }
  h1 { margin-top: 18px; font-family: 'Geist'; font-weight: 600; font-size: 96px; line-height: .98; letter-spacing: -.045em; text-shadow: 0 0 50px rgba(0,0,0,.6); }
  h1 .gold { color: #b6f500; }
  .lead { margin-top: 24px; font-size: 24px; line-height: 1.35; color: rgba(255,255,255,.78); max-width: 30ch; }

  .stats { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr) auto; border-top: 1px solid rgba(255,255,255,.12); }
  .stat { padding: 22px 0 26px 72px; display: flex; flex-direction: column; gap: 2px; }
  .stat + .stat { padding-left: 36px; border-left: 1px solid rgba(255,255,255,.08); }
  .stat strong { font-family: 'Geist'; font-weight: 600; font-size: 34px; letter-spacing: -.03em; }
  .stat span { font-size: 15px; color: rgba(255,255,255,.58); }
  .url { align-self: center; padding: 0 56px 0 24px; font-family: 'Geist Mono'; font-size: 15px; letter-spacing: .06em; color: #c8ff3a; }
</style>
</head>
<body>
  <img class="plate" alt="" />
  <div class="shade"></div>
  <div class="grain"></div>

  <div class="copy">
    <div class="logo">
      <!-- Artix Capital wordmark (artixcapital.com) -->
      <svg viewBox="10 8 1072 330" aria-hidden="true">
        <g fill="#fff" fill-rule="evenodd">
          <path d="M303.9,329.8V136.5c-0.1-2.7-0.5-16.1,9.6-27.6C324.8,96.2,340.4,96,342.7,96h163.5V63.8H336.1c-5.5,0.5-27.4,3.1-44.9,21.6c-15.1,16-18,34.3-18.7,40.4v204H303.9z" />
          <path d="M526.9,15.7h33.2V256c-0.2,2.4-0.4,15.7,7.8,27c8.2,11.4,18.7,13.1,23.1,13h172.6v33.4H590.1c-8.4,0.8-25.4-0.2-43.2-16.9c-16.6-15.7-20.2-32.2-20.1-40.5V15.7z" />
          <rect x="580.7" y="65.1" width="182.8" height="31.8" />
          <rect x="784" y="65.8" width="32.8" height="263.9" />

        </g>
        <polygon fill="#851c23" points="1074.6,15.7 985.7,144.5 907.8,15.7" />
        <polygon fill="#ec2026" points="907.8,15.7 966.5,113.4 1011,83.7" />
        <polygon fill="#d71f29" points="1074.6,15.7 994.5,15.7 1011,83.7" />
        <polygon fill="#47b549" points="926.2,200.9 1004.1,329.8 837.3,329.8" />
        <polygon fill="#8dc582" points="1003.8,329.3 944.1,230.5 901.3,259.7" />
        <polygon fill="#30a150" points="918.6,329.8 901.3,259.7 837.3,329.8" />
        <polygon fill="#1b713b" points="944.1,230.5 871.6,280.1 911.3,222.5" />
      </svg>
      <span class="tag">PROP</span>
    </div>
    <div class="eyebrow">Artix Capital · Prop Program</div>
    <h1>Get funded.<br />Up to <span class="gold">$200K.</span></h1>
    <p class="lead">Pass the challenge, trade our capital and keep up to 90% of the profits.</p>
  </div>

  <div class="stats">
    <div class="stat"><strong>$200K</strong><span>Max allocation</span></div>
    <div class="stat"><strong>90%</strong><span>Profit split</span></div>
    <div class="stat"><strong>24h</strong><span>Payouts</span></div>
    <div class="stat"><strong>150+</strong><span>Instruments</span></div>
    <div class="url">__HOST__</div>
  </div>
</body>
</html>
